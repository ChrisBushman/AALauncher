name: Windows release build
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to (blank = build a CI artifact only)"
        required: false
      base_tag:
        description: "Release to copy the curated -Windows.zip from before swapping in the fresh exe (e.g. v1.2.2); blank = latest"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
      - name: Build AALauncher.exe (Release|Win32)
        run: >
          msbuild AALauncher/AALauncher.sln
          /p:Configuration=Release
          /p:Platform=Win32
          /p:PlatformToolset=v143
          /p:TargetFrameworkVersion=v4.8
          /p:CLRSupport=true
      - name: Locate build output
        shell: bash
        run: |
          find AALauncher -iname 'AALauncher.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: AALauncher-windows
          path: AALauncher/Release/AALauncher.exe
          if-no-files-found: error

      - name: Swap fresh exe into curated -Windows.zip and publish
        if: ${{ inputs.tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="AALauncher-Windows.zip"
          if [ -n "${{ inputs.base_tag }}" ]; then
            gh release download "${{ inputs.base_tag }}" -p "$asset" --clobber
          else
            gh release download -p "$asset" --clobber
          fi
          rm -rf "AALauncher-Windows"
          unzip -q "$asset"
          cp "AALauncher/Release/AALauncher.exe" "AALauncher-Windows/AALauncher.exe"
          rm -f "$asset"
          7z a -tzip "$asset" "AALauncher-Windows" >/dev/null
          gh release upload "${{ inputs.tag }}" "$asset" --clobber
