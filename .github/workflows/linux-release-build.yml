name: Linux release build

# One-off/manual build for release packaging, not a permanent CI gate --
# same role as windows-release-build.yml, but for the Qt6 + WebEngineWidgets
# tree under mac/ (which, despite the directory name, has no Apple-specific
# code -- it's the same launcher CMake build Linux reuses via the root
# CMakeLists.txt's unconditional add_subdirectory(mac)). Triggered by hand
# from the Actions tab or `gh workflow run linux-release-build.yml`.
#
# Unlike AmuletsArmor/AAServer (a handful of SDL .so files, bundled with a
# plain $ORIGIN rpath), Qt6 + WebEngine's dependency tree is too large for
# that to be practical by hand -- linuxdeploy + linuxdeploy-plugin-qt do
# the equivalent job (rpath-patch every Qt/WebEngine .so it needs to
# $ORIGIN-relative paths) properly. Deliberately *not* using their
# "-output appimage" step: an AppImage FUSE-mounts itself at a temp path
# at runtime, which would break QCoreApplication::applicationDirPath() --
# MainWindow.cpp's same-directory AA/AAServer/AAScriptCompiler lookup
# (see mac/MainWindow.cpp) needs a real, stable on-disk directory. Staying
# with a plain deployed usr/ tree keeps that lookup working exactly like
# every other platform's release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish the asset to (blank = build a CI artifact only, don't publish)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            qt6-base-dev qt6-webengine-dev qt6-l10n-tools \
            desktop-file-utils imagemagick patchelf

      - name: Configure
        run: cmake -S . -B out/linux -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build AALauncher
        run: cmake --build out/linux --target AALauncher -j

      - name: Download linuxdeploy + Qt plugin
        run: |
          curl -sL -o /tmp/linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -sL -o /tmp/linuxdeploy-plugin-qt.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x /tmp/linuxdeploy.AppImage /tmp/linuxdeploy-plugin-qt.AppImage

      - name: Assemble AppDir and deploy Qt/WebEngine dependencies
        run: |
          mkdir -p appdir/usr/bin appdir/usr/share/applications \
            appdir/usr/share/icons/hicolor/256x256/apps
          cp out/linux/mac/AALauncher appdir/usr/bin/
          cat > appdir/usr/share/applications/aalauncher.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=AALauncher
          Exec=AALauncher
          Icon=aalauncher
          Categories=Game;
          EOF
          convert AALauncher/anaicon.ico[4] \
            appdir/usr/share/icons/hicolor/256x256/apps/aalauncher.png

          export QMAKE=/usr/bin/qmake6
          export PATH=/tmp:$PATH
          export APPIMAGE_EXTRACT_AND_RUN=1
          /tmp/linuxdeploy.AppImage \
            --appdir appdir \
            --executable appdir/usr/bin/AALauncher \
            --desktop-file appdir/usr/share/applications/aalauncher.desktop \
            --icon-file appdir/usr/share/icons/hicolor/256x256/apps/aalauncher.png \
            --plugin qt

      - name: Package release archive
        run: |
          mv appdir AALauncher-Linux
          tar czf AALauncher-Linux.tar.gz AALauncher-Linux

      - uses: actions/upload-artifact@v4
        with:
          name: AALauncher-Linux
          path: AALauncher-Linux.tar.gz
          if-no-files-found: error

      - name: Publish to release
        if: ${{ inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" AALauncher-Linux.tar.gz --clobber
